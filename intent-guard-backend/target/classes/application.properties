# ==========================================================================
# INTENT GUARD — Spring Boot Backend Configuration
# Tagline: "Your intent. Your limits. Your control."
# Core Security Principle: "The AI gets permission, not credentials."
# ==========================================================================

spring.application.name=intent-guard-backend
server.port=8080

# Database Configuration (MySQL / H2 Embedded Fallback for Farmlink DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:farmlink;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Automatic SQL initialization on startup (Spring JDBC)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# SERPER API KEY Placeholder for SearchService (Read from environment if set)
serper.api.key=${SERPER_API_KEY:}

# Logging Configuration
logging.level.com.intentguard.backend=INFO
logging.level.org.springframework.jdbc.core=INFO
